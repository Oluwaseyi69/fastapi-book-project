name: Deployment Pipeline

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python3 --version: "3.13.1"  

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to Server via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/github-deploy-key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /soft/Desktop/fastapi-book-project  
            git pull origin main  
            source /soft/Desktop/fastapi-book-project/venv/bin/activate  
            pip install -r requirements.txt  
            systemctl restart fastapi-app.service 
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}  
